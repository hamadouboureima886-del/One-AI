<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f7;--ink:#14213d;--mute:#5b6784;--line:#cfd7e6;--card:#fff;--acc:#2b4bff;--onacc:#fff;--mk:#ffe98a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--ink:#e8edfb;--mute:#93a0c2;--line:#26304d;--card:#161e36;--acc:#8ea2ff;--onacc:#0e1424;--mk:#5c4d10}}
:root[data-theme="dark"]{--bg:#0e1424;--ink:#e8edfb;--mute:#93a0c2;--line:#26304d;--card:#161e36;--acc:#8ea2ff;--onacc:#0e1424;--mk:#5c4d10}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5}
main{max-width:680px;margin:0 auto;padding:40px 20px 64px}
h1{font-size:clamp(72px,22vw,132px);font-weight:800;letter-spacing:-.05em;line-height:.9;margin:0 0 12px}
.tag{color:var(--mute);margin:0 0 28px;font-size:18px;max-width:34ch}
.bar{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:6px 8px 6px 18px}
.bar:focus-within{border-color:var(--acc);outline:3px solid color-mix(in srgb,var(--acc) 30%,transparent)}
input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:20px;padding:12px 0;outline:none}
#badge{flex:none;background:var(--acc);color:var(--onacc);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 22px}
.chips button{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.chips button:hover,.chips button:focus-visible{border-color:var(--acc);outline:none}
.res{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.res p{margin:0}.res small{color:var(--mute)}
.res.big b{display:block;font-size:44px;letter-spacing:-.03em;line-height:1.1}
.hint{color:var(--mute);margin:0 0 10px}
mark{background:var(--mk);color:inherit;border-radius:3px;padding:0 2px}
h2{font-size:22px;margin:36px 0 12px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;border-top:1px solid var(--line);padding:12px 0;overflow-wrap:anywhere}
li button{flex:none;font:inherit;font-size:14px;color:var(--mute);background:none;border:0;cursor:pointer;padding:2px 6px}
li button:hover,li button:focus-visible{color:var(--acc);outline:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <h1>ONE</h1>
  <p class="tag">Une seule barre pour tes calculs, tes notes et ta recherche.</p>
  <div class="bar">
    <input id="q" type="text" placeholder="Essaie : 18% de 2450" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Barre de commande">
    <span id="badge">Prêt</span>
  </div>
  <div class="chips" id="chips">
    <button type="button">18% de 2450</button>
    <button type="button">(120 + 45) x 3</button>
    <button type="button">note: appeler Sam jeudi</button>
  </div>
  <div id="out" aria-live="polite"></div>
  <h2>Tes notes</h2>
  <ul id="notes"></ul>
</main>
<script>
let notes=[];const K='one-notes';
try{notes=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(notes))}catch(e){}};
const $=s=>document.querySelector(s),q=$('#q'),out=$('#out'),badge=$('#badge'),list=$('#notes');
const fmt=n=>Number(n.toFixed(6)).toLocaleString('fr-FR');
const esc=x=>x.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl=(n,s)=>esc(n).replace(new RegExp(esc(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>'<mark>'+m+'</mark>');
const noteRe=/^(?:note|n)\s*:\s*(.*)$/i;
function calc(s){
  let t=s.toLowerCase().replace(/,/g,'.').replace(/\s/g,'');
  const m=t.match(/^(\d+(?:\.\d+)?)%de(\d+(?:\.\d+)?)$/);
  if(m)return +m[1]/100*+m[2];
  t=t.replace(/x/g,'*').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');
  if(!/^[\d+\-*/().]+$/.test(t)||!/\d/.test(t)||!/[+\-*/]/.test(t.replace(/^-/,'')))return null;
  try{const v=Function('"use strict";return ('+t+')')();return isFinite(v)?v:null}catch(e){return null}
}
function renderNotes(){
  list.innerHTML=notes.length?notes.map((n,i)=>'<li><span>'+esc(n)+'</span><button data-i="'+i+'" aria-label="Supprimer la note">Supprimer</button></li>').join(''):'<p class="hint">Aucune note pour l\u2019instant. Écris « note: … » dans la barre.</p>';
}
function render(){
  const s=q.value.trim();
  if(!s){badge.textContent='Prêt';out.innerHTML='<p class="hint">Écris un calcul, une note ou un mot à chercher. ONE choisit le bon outil.</p>';return}
  const nm=s.match(noteRe);
  if(nm){badge.textContent='Note';out.innerHTML=nm[1]?'<div class="res"><p>'+esc(nm[1])+'</p><small>Appuie sur Entrée pour enregistrer la note.</small></div>':'<p class="hint">Écris le texte de ta note après les deux-points.</p>';return}
  const c=calc(s);
  if(c!==null){badge.textContent='Calcul';out.innerHTML='<div class="res big"><b>'+fmt(c)+'</b><small>Entrée pour l\u2019enregistrer dans tes notes.</small></div>';return}
  badge.textContent='Recherche';
  const r=notes.filter(n=>n.toLowerCase().includes(s.toLowerCase()));
  out.innerHTML=r.length?r.map(n=>'<div class="res"><p>'+hl(n,s)+'</p></div>').join(''):'<p class="hint">Aucune note ne contient « '+esc(s)+' ». Entrée pour l\u2019enregistrer comme note.</p>';
}
q.addEventListener('input',render);
q.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const s=q.value.trim();if(!s)return;
  const nm=s.match(noteRe),c=calc(s);
  const txt=nm?nm[1].trim():(c!==null?s+' = '+fmt(c):s);
  if(!txt)return;
  notes.unshift(txt);save();q.value='';renderNotes();render();
  out.insertAdjacentHTML('afterbegin','<p class="hint">Note enregistrée.</p>');
});
$('#chips').addEventListener('click',e=>{if(e.target.tagName==='BUTTON'){q.value=e.target.textContent;render();q.focus()}});
list.addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b){notes.splice(+b.dataset.i,1);save();renderNotes();render()}});
renderNotes();render();
</script>
</body>
</html>
